name: Device Monitor CI

on:
  push:
    branches:
      - v2.5-development
      - v2.6-development
      - v2.7-development
      - v2.8-development
      - v2.9-development
      - v2.10-development
      # v2.11 feature work (30 September 2026): the async-DB refactor branch is listed explicitly
      # so its pushes are validated remotely. `pull_request.branches` is deliberately NOT extended
      # with it: that filter matches the PR *base* branch, so a head branch listed there would only
      # match pull requests whose target is this feature branch. The eventual PR into
      # `v2.10-development` is already covered by the entry below.
      - feature/async-db-v2.11
  pull_request:
    branches:
      - v2.5-development
      - v2.6-development
      - v2.7-development
      - v2.8-development
      - v2.9-development
      - v2.10-development

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # The release-manifest test reads the immutable v2.9 tag.

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli gettext sqlite3

      - name: Compile Python sources
        run: |
          set -eu
          find src -type f -name '*.py' -print0 |
            xargs -0 -n1 python3 -m py_compile

      - name: Validate opt-in port discovery
        run: python3 tests/test_port_discovery.py

      # v2.11 Task 1B: the deferred-write refactor's own verification asset. It carries its own
      # drain bounds at the call site (flush_db_writes(5.0 / 15.0 / 1.0)) and reads no environment
      # variable, so there is no queue-size or runner-timeout variable to set here.
      - name: Validate deferred database writes (v2.11)
        run: python3 tests/test_deferred_db_writes.py

      - name: Lint PHP sources
        run: |
          set -eu
          find src -type f -name '*.php' -print0 |
            xargs -0 -n1 php -l

      - name: Check shell syntax
        run: |
          set -eu
          sh -n install.sh
          sh -n install-unattended.sh
          python3 tests/test_release_manifest.py
          sh -n uninstall.sh
          sh -n src/opnsense/scripts/OPNsense/DeviceMonitor/daemon_status.sh

      - name: Compile gettext catalogues
        run: |
          set -eu
          mkdir -p /tmp/devicemonitor-mo
          for lang in en_US cs_CZ de_DE fr_FR es_ES it_IT pt_BR nl_NL ru_RU ja_JP zh_CN; do
            mkdir -p "/tmp/devicemonitor-mo/${lang}/LC_MESSAGES"
            msgfmt \
              "src/opnsense/mvc/app/languages/${lang}/LC_MESSAGES/devicemonitor.po" \
              -o "/tmp/devicemonitor-mo/${lang}/LC_MESSAGES/devicemonitor.mo"
          done

      - name: Validate translated JavaScript
        run: python3 tests/test_translated_javascript.py

      - name: Validate core catalogue merge (DM-BL-008c)
        run: python3 tests/test_locale_merge.py

      - name: Validate language acceptance (DM-BL-008)
        run: |
          set -eu
          python3 tests/test_language_acceptance.py --engine interpolate

          # Production-parity runtime matrix. The runtime engine reproduces the OPNsense MVC view
          # path, so it needs the shared OPNsense.mo catalogues the GUI reads (DM-BL-008a lists the
          # host-blocked ones) plus the Phalcon Volt compiler and OPNsense\Base\ViewTranslator. A
          # runner without those assets aborts that engine by design, so the matrix is skipped with
          # an explicit reason instead of failing the job, and host-blocked languages are bypassed
          # while every language the runner can serve is still rendered and checked.
          if [ ! -f /usr/local/opnsense/mvc/app/library/OPNsense/Base/ViewTranslator.php ] ||
             [ "$(php -r 'echo class_exists("Phalcon\\Mvc\\View\\Engine\\Volt\\Compiler") ? "yes" : "no";')" != yes ]; then
            echo 'SKIPPED runtime matrix: Phalcon Volt compiler and/or OPNsense ViewTranslator not installed on this runner'
            exit 0
          fi

          available=''
          for lang in de_DE fr_FR es_ES it_IT pt_BR nl_NL ru_RU ja_JP zh_CN; do
            if [ -f "/usr/local/share/locale/${lang}/LC_MESSAGES/OPNsense.mo" ]; then
              available="${available:+${available},}${lang}"
            else
              echo "SKIPPED ${lang}: shared OPNsense.mo catalogue absent on this runner (host-blocked language)"
            fi
          done

          if [ -z "$available" ]; then
            echo 'SKIPPED runtime matrix: no shared OPNsense.mo catalogues on this runner'
            exit 0
          fi

          python3 tests/test_language_acceptance.py --engine runtime --languages "$available"

      - name: Configure Host System Locales for Translation Probes
        run: |
          sudo locale-gen fr_FR.UTF-8 de_DE.UTF-8
          sudo update-locale

      - name: Validate sidecar catalogue resolution (O3/O4)
        run: python3 tests/test_sidecar_catalogue.py

      - name: Validate Device Monitor database migrations
        run: |
          set -eu

          sudo mkdir -p /usr/local/opnsense/mvc/app/models/OPNsense/DeviceMonitor

          sudo tee /usr/local/opnsense/mvc/app/models/OPNsense/DeviceMonitor/defaults.json >/dev/null <<'JSON'
          {
            "paths": {
              "hostwatchDb": "/tmp/devicemonitor-ci-hostwatch.db",
              "configFile": "/tmp/devicemonitor-ci-config.json",
              "dbFile": "/tmp/devicemonitor-ci-devices.db"
            },
            "config": {}
          }
          JSON

          python3 <<'PY'
          import importlib.util
          import sqlite3
          import tempfile
          from pathlib import Path

          source = Path(
              "src/opnsense/scripts/OPNsense/DeviceMonitor/scan_network.py"
          )

          spec = importlib.util.spec_from_file_location(
              "devicemonitor_scan_network",
              source
          )
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          with tempfile.TemporaryDirectory() as tmp:
              db_path = Path(tmp) / "devices.db"

              # Start with a minimal pre-v2.5-style database.
              conn = sqlite3.connect(db_path)
              conn.execute("""
                  CREATE TABLE devices (
                      mac TEXT PRIMARY KEY,
                      ip TEXT,
                      hostname TEXT,
                      vendor TEXT,
                      vlan TEXT,
                      last_seen DATETIME DEFAULT CURRENT_TIMESTAMP,
                      notified INTEGER DEFAULT 0,
                      is_active INTEGER DEFAULT 0,
                      notification_pending INTEGER DEFAULT 0,
                      first_seen DATETIME DEFAULT CURRENT_TIMESTAMP,
                      custom_hostname TEXT DEFAULT NULL,
                      nmap_scan_pending INTEGER DEFAULT 0
                  )
              """)

              conn.execute("""
                  CREATE TABLE deleted_devices (
                      mac TEXT PRIMARY KEY,
                      last_seen DATETIME,
                      deleted_at DATETIME DEFAULT CURRENT_TIMESTAMP
                  )
              """)

              conn.execute("""
                  INSERT INTO devices
                  (mac, ip, hostname, vendor, vlan)
                  VALUES
                  ('aa:bb:cc:dd:ee:01', '192.0.2.10',
                   'existing-device', 'Example', 'LAN')
              """)

              conn.commit()
              conn.close()

              module.DB_FILE = str(db_path)
              module.init_db()

              conn = sqlite3.connect(db_path)

              columns = {
                  row[1]
                  for row in conn.execute("PRAGMA table_info(devices)")
              }

              required_columns = {
                  "nmap_scan_pending",
                  "nmap_scan_attempts",
                  "nmap_next_attempt",
                  "nmap_last_error",
              }

              missing = required_columns - columns
              assert not missing, f"Missing retry columns: {sorted(missing)}"

              known_columns = {
                  row[1]
                  for row in conn.execute("PRAGMA table_info(known_macs)")
              }

              assert {"mac", "first_seen", "last_seen"} <= known_columns

              known_count = conn.execute("""
                  SELECT COUNT(*)
                  FROM known_macs
                  WHERE mac = 'aa:bb:cc:dd:ee:01'
              """).fetchone()[0]

              assert known_count == 1, (
                  "Existing device was not seeded into known_macs"
              )

              retry_defaults = conn.execute("""
                  SELECT
                      nmap_scan_attempts,
                      nmap_next_attempt,
                      nmap_last_error
                  FROM devices
                  WHERE mac = 'aa:bb:cc:dd:ee:01'
              """).fetchone()

              assert retry_defaults == (0, None, None), retry_defaults

              conn.close()

          print("Device Monitor migration checks passed")
          PY
      - name: Validate v2.7 identity detection
        run: |
          set -eu

          python3 <<'PY'
          import importlib.util
          import json
          import sqlite3
          import tempfile
          from datetime import datetime, timezone
          from pathlib import Path

          source = Path(
              "src/opnsense/scripts/OPNsense/DeviceMonitor/scan_network.py"
          )

          spec = importlib.util.spec_from_file_location(
              "devicemonitor_scan_network",
              source
          )
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          with tempfile.TemporaryDirectory() as tmp:
              tmp_path = Path(tmp)
              hostwatch_db = tmp_path / "hostwatch.db"
              devices_db = tmp_path / "devices.db"

              module.HOSTWATCH_DB = str(hostwatch_db)
              module.DB_FILE = str(devices_db)

              with sqlite3.connect(hostwatch_db) as hw:
                  hw.execute("""
                      CREATE TABLE v_hosts (
                          interface_name TEXT,
                          ip_address TEXT,
                          ether_address TEXT,
                          last_seen TEXT,
                          protocol TEXT
                      )
                  """)

              conn = sqlite3.connect(devices_db)
              conn.execute("""
                  CREATE TABLE device_identity_events (
                      id INTEGER PRIMARY KEY AUTOINCREMENT,
                      mac TEXT NOT NULL,
                      event_type TEXT NOT NULL,
                      severity TEXT NOT NULL,
                      detected_at DATETIME NOT NULL
                          DEFAULT CURRENT_TIMESTAMP,
                      ip TEXT,
                      other_ip TEXT,
                      other_mac TEXT,
                      interface TEXT,
                      other_interface TEXT,
                      details TEXT,
                      resolved_at DATETIME
                  )
              """)
              conn.commit()

              now = (
                  datetime.now(timezone.utc)
                  .replace(tzinfo=None)
                  .strftime("%Y-%m-%d %H:%M:%S")
              )

              def set_hosts(rows):
                  with sqlite3.connect(hostwatch_db) as hw:
                      hw.execute("DELETE FROM v_hosts")
                      hw.executemany("""
                          INSERT INTO v_hosts
                          (
                              interface_name,
                              ip_address,
                              ether_address,
                              last_seen,
                              protocol
                          )
                          VALUES (?, ?, ?, ?, ?)
                      """, rows)

                  conn.execute("DELETE FROM device_identity_events")
                  conn.commit()

              # Same IPv4 owned by two MACs.
              set_hosts([
                  ("IGC1", "192.0.2.10",
                   "aa:bb:cc:dd:ee:01", now, "inet"),
                  ("IGC1", "192.0.2.10",
                   "aa:bb:cc:dd:ee:02", now, "inet"),
              ])

              kea = [{
                  "ip": "192.0.2.10",
                  "mac": "aa:bb:cc:dd:ee:02",
                  "active": True,
                  "hostname": "test-device",
                  "subnet_id": 1,
                  "cltt": 1,
                  "expires_at": "2099-01-01 00:00:00",
              }]

              created = module.detect_recent_hostwatch_identity_events(
                  conn,
                  minutes=5,
                  kea_leases=kea
              )
              assert created == 1, created

              row = conn.execute("""
                  SELECT event_type, severity, mac, other_mac, details
                  FROM device_identity_events
              """).fetchone()

              assert row[0] == "IP_IDENTITY_CHANGED", row
              assert row[1] == "high", row
              assert row[2] == "aa:bb:cc:dd:ee:01", row
              assert row[3] == "aa:bb:cc:dd:ee:02", row

              details = json.loads(row[4])
              assert (
                  details["kea_evidence"]["status"]
                  == "matches_one_hostwatch_mac"
              ), details

              # Re-running identical evidence must not duplicate the event.
              created = module.detect_recent_hostwatch_identity_events(
                  conn,
                  minutes=5,
                  kea_leases=kea
              )
              assert created == 0, created

              # One MAC on multiple IPv4 addresses.
              set_hosts([
                  ("IGC1", "192.0.2.20",
                   "aa:bb:cc:dd:ee:03", now, "inet"),
                  ("IGC1", "192.0.2.21",
                   "aa:bb:cc:dd:ee:03", now, "inet"),
              ])

              created = module.detect_recent_hostwatch_identity_events(
                  conn,
                  minutes=5
              )
              assert created == 1, created

              event_type = conn.execute("""
                  SELECT event_type
                  FROM device_identity_events
              """).fetchone()[0]
              assert event_type == "MAC_MULTI_IP", event_type

              # Same MAC/IP simultaneously visible on two interfaces.
              set_hosts([
                  ("IGC1", "192.0.2.30",
                   "aa:bb:cc:dd:ee:04", now, "inet"),
                  ("IGC2", "192.0.2.30",
                   "aa:bb:cc:dd:ee:04", now, "inet"),
              ])

              created = module.detect_recent_hostwatch_identity_events(
                  conn,
                  minutes=5
              )
              assert created == 1, created

              event_type = conn.execute("""
                  SELECT event_type
                  FROM device_identity_events
              """).fetchone()[0]
              assert event_type == "MAC_MULTI_INTERFACE", event_type

              # Link-local IPv6 and multiple IPv6 addresses on one MAC
              # are deliberately non-anomalous.
              set_hosts([
                  ("IGC1", "fe80::1",
                   "aa:bb:cc:dd:ee:05", now, "inet6"),
                  ("IGC1", "fd00::10",
                   "aa:bb:cc:dd:ee:05", now, "inet6"),
                  ("IGC1", "fd00::11",
                   "aa:bb:cc:dd:ee:05", now, "inet6"),
              ])

              created = (
                  module.detect_recent_hostwatch_ipv6_identity_events(
                      conn,
                      minutes=5
                  )
              )
              assert created == 0, created

              # Same non-link-local IPv6 owned by two MACs is anomalous.
              set_hosts([
                  ("IGC1", "fd00::20",
                   "aa:bb:cc:dd:ee:06", now, "inet6"),
                  ("IGC1", "fd00::20",
                   "aa:bb:cc:dd:ee:07", now, "inet6"),
              ])

              created = (
                  module.detect_recent_hostwatch_ipv6_identity_events(
                      conn,
                      minutes=5
                  )
              )
              assert created == 1, created

              row = conn.execute("""
                  SELECT event_type, severity, other_mac, details
                  FROM device_identity_events
              """).fetchone()

              assert row[0] == "IPV6_IDENTITY_CHANGED", row
              assert row[1] == "high", row
              assert row[2] == "aa:bb:cc:dd:ee:07", row
              assert json.loads(row[3])["address_scope"] == "ula"

              conn.close()

          print("Device Monitor identity regression checks passed")
          PY
      - name: Validate v2.8 identity email alerts
        run: |
          set -eu

          python3 <<'PY'
          import importlib.util
          import json
          import sqlite3
          import tempfile
          from datetime import datetime, timezone
          from pathlib import Path
          from types import SimpleNamespace

          SOURCE = Path("src/opnsense/scripts/OPNsense/DeviceMonitor/scan_network.py")
          DEFAULTS = Path("src/opnsense/mvc/app/models/OPNsense/DeviceMonitor/defaults.json")

          defaults = json.loads(DEFAULTS.read_text(encoding="utf-8"))
          assert defaults["config"]["identity_webhook_enabled"] == "0"

          spec = importlib.util.spec_from_file_location(
              "devicemonitor_scan_network",
              SOURCE
          )
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          # Avoid writing Device Monitor logs during regression testing.
          module.log = lambda message: None

          with tempfile.TemporaryDirectory() as tmp:
              tmp_path = Path(tmp)
              hostwatch_db = tmp_path / "hostwatch.db"
              devices_db = tmp_path / "devices.db"

              module.HOSTWATCH_DB = str(hostwatch_db)
              module.DB_FILE = str(devices_db)

              with sqlite3.connect(hostwatch_db) as hw:
                  hw.execute("""
                      CREATE TABLE v_hosts (
                          interface_name TEXT,
                          ip_address TEXT,
                          ether_address TEXT,
                          last_seen TEXT,
                          protocol TEXT
                      )
                  """)

              conn = sqlite3.connect(devices_db)
              conn.execute("""
                  CREATE TABLE device_identity_events (
                      id INTEGER PRIMARY KEY AUTOINCREMENT,
                      mac TEXT NOT NULL,
                      event_type TEXT NOT NULL,
                      severity TEXT NOT NULL,
                      detected_at DATETIME NOT NULL
                          DEFAULT CURRENT_TIMESTAMP,
                      ip TEXT,
                      other_ip TEXT,
                      other_mac TEXT,
                      interface TEXT,
                      other_interface TEXT,
                      details TEXT,
                      resolved_at DATETIME
                  )
              """)
              conn.commit()

              now = (
                  datetime.now(timezone.utc)
                  .replace(tzinfo=None)
                  .strftime("%Y-%m-%d %H:%M:%S")
              )

              def clear_events():
                  conn.execute("DELETE FROM device_identity_events")
                  conn.commit()

              def set_hosts(rows):
                  with sqlite3.connect(hostwatch_db) as hw:
                      hw.execute("DELETE FROM v_hosts")
                      hw.executemany("""
                          INSERT INTO v_hosts
                          (
                              interface_name,
                              ip_address,
                              ether_address,
                              last_seen,
                              protocol
                          )
                          VALUES (?, ?, ?, ?, ?)
                      """, rows)

              def max_event_id():
                  return conn.execute("""
                      SELECT COALESCE(MAX(id), 0)
                      FROM device_identity_events
                  """).fetchone()[0]

              # --------------------------------------------------------
              # IPv4 high-severity event is collected.
              # --------------------------------------------------------
              clear_events()
              set_hosts([
                  ("IGC1", "192.0.2.10",
                   "aa:bb:cc:dd:ee:01", now, "inet"),
                  ("IGC1", "192.0.2.10",
                   "aa:bb:cc:dd:ee:02", now, "inet"),
              ])

              kea = [{
                  "ip": "192.0.2.10",
                  "mac": "aa:bb:cc:dd:ee:02",
                  "active": True,
                  "hostname": "test-device",
                  "subnet_id": 1,
                  "cltt": 1,
                  "expires_at": "2099-01-01 00:00:00",
              }]

              start = max_event_id()

              created = module.detect_recent_hostwatch_identity_events(
                  conn,
                  minutes=5,
                  kea_leases=kea
              )

              assert isinstance(created, int)
              assert created == 1

              events = module.get_new_high_identity_events(conn, start)
              assert len(events) == 1
              assert events[0]["event_type"] == "IP_IDENTITY_CHANGED"
              assert events[0]["severity"] == "high"

              # Same evidence is deduplicated and therefore not recollected.
              start = max_event_id()

              created = module.detect_recent_hostwatch_identity_events(
                  conn,
                  minutes=5,
                  kea_leases=kea
              )

              assert created == 0
              assert module.get_new_high_identity_events(conn, start) == []

              # --------------------------------------------------------
              # IPv6 high-severity event is collected.
              # --------------------------------------------------------
              clear_events()
              set_hosts([
                  ("IGC1", "fd00::20",
                   "aa:bb:cc:dd:ee:06", now, "inet6"),
                  ("IGC1", "fd00::20",
                   "aa:bb:cc:dd:ee:07", now, "inet6"),
              ])

              start = max_event_id()

              created = module.detect_recent_hostwatch_ipv6_identity_events(
                  conn,
                  minutes=5
              )

              assert isinstance(created, int)
              assert created == 1

              events = module.get_new_high_identity_events(conn, start)
              assert len(events) == 1
              assert events[0]["event_type"] == "IPV6_IDENTITY_CHANGED"

              # --------------------------------------------------------
              # Medium MAC_MULTI_IP is recorded but excluded from email.
              # --------------------------------------------------------
              clear_events()
              set_hosts([
                  ("IGC1", "192.0.2.20",
                   "aa:bb:cc:dd:ee:03", now, "inet"),
                  ("IGC1", "192.0.2.21",
                   "aa:bb:cc:dd:ee:03", now, "inet"),
              ])

              start = max_event_id()

              created = module.detect_recent_hostwatch_identity_events(
                  conn,
                  minutes=5
              )

              assert created == 1
              assert module.get_new_high_identity_events(conn, start) == []

              # --------------------------------------------------------
              # Medium MAC_MULTI_INTERFACE is also excluded.
              # --------------------------------------------------------
              clear_events()
              set_hosts([
                  ("IGC1", "192.0.2.30",
                   "aa:bb:cc:dd:ee:04", now, "inet"),
                  ("IGC2", "192.0.2.30",
                   "aa:bb:cc:dd:ee:04", now, "inet"),
              ])

              start = max_event_id()

              created = module.detect_recent_hostwatch_identity_events(
                  conn,
                  minutes=5
              )

              assert created == 1
              assert module.get_new_high_identity_events(conn, start) == []

              # --------------------------------------------------------
              # Configuration gating.
              # --------------------------------------------------------
              sample_events = [
                  {
                      "event_type": "IP_IDENTITY_CHANGED",
                      "severity": "high",
                      "mac": "aa:bb:cc:dd:ee:01",
                      "other_mac": "aa:bb:cc:dd:ee:02",
                      "ip": "192.0.2.10",
                  }
              ]

              base_config = {
                  "enabled": True,
                  "email_enabled": True,
                  "email_to": "admin@example.test",
                  "webhook_enabled": True,
                  "webhook_url": "https://example.test/dm-webhook",
              }

              off_config = dict(base_config)
              off_config["identity_webhook_enabled"] = False

              assert not module.should_send_identity_email(
                  off_config,
                  sample_events
              )

              on_config = dict(base_config)
              on_config["identity_webhook_enabled"] = True

              assert module.should_send_identity_email(
                  on_config,
                  sample_events
              )

              # The webhook transport still gates the leg (DECISIONS.md 36).
              no_webhook_config = dict(on_config)
              no_webhook_config["webhook_enabled"] = False

              assert not module.should_send_identity_email(
                  no_webhook_config,
                  sample_events
              )

              no_url_config = dict(on_config)
              no_url_config["webhook_url"] = ""

              assert not module.should_send_identity_email(
                  no_url_config,
                  sample_events
              )

              # The email settings no longer gate the leg.
              email_off_config = dict(on_config)
              email_off_config["email_enabled"] = False
              email_off_config["email_to"] = ""

              assert module.should_send_identity_email(
                  email_off_config,
                  sample_events
              )

              monitoring_off_config = dict(on_config)
              monitoring_off_config["enabled"] = False

              assert not module.should_send_identity_email(
                  monitoring_off_config,
                  sample_events
              )

              assert not module.should_send_identity_email(
                  on_config,
                  []
              )

              # --------------------------------------------------------
              # Multiple events result in exactly one PHP invocation.
              # --------------------------------------------------------
              calls = []

              def successful_run(command, **kwargs):
                  calls.append((command, kwargs))
                  return SimpleNamespace(
                      returncode=0,
                      stdout='{"result":"sent"}',
                      stderr=""
                  )

              module.subprocess.run = successful_run

              two_events = [
                  sample_events[0],
                  {
                      "event_type": "IPV6_IDENTITY_CHANGED",
                      "severity": "high",
                      "mac": "aa:bb:cc:dd:ee:06",
                      "other_mac": "aa:bb:cc:dd:ee:07",
                      "ip": "fd00::20",
                  },
              ]

              assert module.send_identity_email(two_events) is True
              assert len(calls) == 1

              payload = json.loads(calls[0][1]["input"])
              assert len(payload["events"]) == 2

              # --------------------------------------------------------
              # Helper-side skip is not a successful delivery.
              # --------------------------------------------------------
              def skipped_run(command, **kwargs):
                  return SimpleNamespace(
                      returncode=0,
                      stdout=json.dumps({
                          "result": "skipped",
                          "message": "Email disabled",
                      }),
                      stderr="",
                  )

              module.subprocess.run = skipped_run

              assert module.send_identity_email(sample_events) is False
              # --------------------------------------------------------
              # Disabled setting means no notification process is invoked.
              # --------------------------------------------------------
              calls.clear()

              if module.should_send_identity_email(off_config, two_events):
                  module.send_identity_email(two_events)

              assert calls == []

              # --------------------------------------------------------
              # Mail failure does not remove the already-stored event and
              # is returned as False rather than aborting scan handling.
              # --------------------------------------------------------
              clear_events()

              conn.execute("""
                  INSERT INTO device_identity_events
                  (mac, event_type, severity, ip, other_mac)
                  VALUES (?, ?, ?, ?, ?)
              """, (
                  "aa:bb:cc:dd:ee:01",
                  "IP_IDENTITY_CHANGED",
                  "high",
                  "192.0.2.10",
                  "aa:bb:cc:dd:ee:02",
              ))
              conn.commit()

              before = conn.execute("""
                  SELECT COUNT(*) FROM device_identity_events
              """).fetchone()[0]

              def failing_run(command, **kwargs):
                  return SimpleNamespace(
                      returncode=1,
                      stdout="",
                      stderr="simulated mail failure"
                  )

              module.subprocess.run = failing_run

              assert module.send_identity_email(sample_events) is False

              after = conn.execute("""
                  SELECT COUNT(*) FROM device_identity_events
              """).fetchone()[0]

              assert after == before == 1

              conn.close()

          print("Device Monitor v2.8 identity email regression checks passed")
          PY
